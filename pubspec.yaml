name: tcp_tunnel
description: A minimalistic TCP tunnel library, entirely written in Dart, and equipped with a user-friendly Command Line Interface (CLI) for seamless usage across diverse platforms.
version: 2.2.1
repository: https://github.com/gmpassos/tcp_tunnel

environment:
  sdk: ^3.13.0

# Throwaway self-signed localhost certificate used only by the security tests
# (its CA private key was discarded after signing); not a real secret.
false_secrets:
  - /test/certs/key.pem

executables:
  tcp_tunnel:

dependencies:
  logging: ^1.3.0

dev_dependencies:
  lints: ^6.1.0
  dependency_validator: ^5.1.0
  test: ^1.33.0
